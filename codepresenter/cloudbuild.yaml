substitutions:
  _REGION: us-central1
  _SERVICE: jupyter-server-launcher
  _CODEPRESENTER_BASE_URL: https://present.ailivelearn.com
  _FRONTEND_ORIGIN: https://present.ailivelearn.com
  _COOKIE_DOMAIN: .ailivelearn.com
  _CLOUD_RUN_URL: https://jupyter-server-launcher-li7sbmqmva-uc.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/jupyter-server-launcher:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/jupyter-server-launcher:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/jupyter-server-launcher:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/jupyter-server-launcher:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/jupyter-server-launcher:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 4Gi
      - --cpu
      - "2"
      - --cpu-boost
      - --no-cpu-throttling
      - --timeout
      - "3600"
      - --concurrency
      - "20"
      - --min-instances
      - "1"
      - --max-instances
      - "1"
      - --set-env-vars
      - NODE_ENV=production,AI_PROVIDER=google-gemma,GEMMA_MODEL=gemma-4-31b-it,CODEPRESENTER_BASE_URL=${_CODEPRESENTER_BASE_URL},FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},COOKIE_DOMAIN=${_COOKIE_DOMAIN},CLOUD_RUN_URL=${_CLOUD_RUN_URL},VITE_CODEPRESENTER_WS_URL=wss://jupyter-server-launcher-li7sbmqmva-uc.a.run.app/ws,JUPYTER_PORT=8888
      - --set-secrets
      - GOOGLE_API_KEY=GEMINI_GEMMA_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,ACCESS_CODE=ACCESS_CODE:latest,JUPYTER_TOKEN=JUPYTER_TOKEN:latest,VITE_FIREBASE_API_KEY=VITE_FIREBASE_API_KEY:latest,VITE_FIREBASE_AUTH_DOMAIN=VITE_FIREBASE_AUTH_DOMAIN:latest,VITE_FIREBASE_PROJECT_ID=VITE_FIREBASE_PROJECT_ID:latest,VITE_FIREBASE_STORAGE_BUCKET=VITE_FIREBASE_STORAGE_BUCKET:latest,VITE_FIREBASE_MESSAGING_SENDER_ID=VITE_FIREBASE_MESSAGING_SENDER_ID:latest,VITE_FIREBASE_APP_ID=VITE_FIREBASE_APP_ID:latest

images:
  - gcr.io/$PROJECT_ID/jupyter-server-launcher:$BUILD_ID
  - gcr.io/$PROJECT_ID/jupyter-server-launcher:latest
